[project]
name = "redline-engine"
version = "1.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008", "E501"]  # long prose strings; ruff format governs code width

[tool.pytest.ini_options]
testpaths = ["tests"]
